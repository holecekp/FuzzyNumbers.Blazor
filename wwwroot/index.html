<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fuzzy numbers demo</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <!-- If you add any scoped CSS files, uncomment the following to load them
    <link href="FuzzyNumbers.Blazor.styles.css" rel="stylesheet" /> -->
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <script type="importmap"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });</script>

    <script>
        var chart;

        window.updateGraphData = function(datasetA, datasetB)
        {
            chart.config.data.datasets[0].data = datasetA;
            chart.config.data.datasets[1].data = datasetB;
            chart.update();
        }

        window.drawGraph = function (datasetA, datasetB)
        {
            const ctx = document.getElementById('fuzzyGraph');        
            var config = {
                type: 'line',
                data: {
                        datasets: [
                        {
                            label: 'A',
                            data: datasetA,
                            pointStyle: false,
                            borderColor: 'rgb(229, 57, 53)',
                            borderWidth: 1,
                            fill: true,
                            backgroundColor: 'rgba(255, 200, 200, 0.3)'
                        },
                        {
                            label: 'B',
                            data: datasetB,
                            pointStyle: false,
                            borderColor: 'rgb(57, 53, 229)',
                            borderWidth: 1,
                            fill: true,
                            backgroundColor: 'rgba(200, 200, 255, 0.3)'
                        },

                    ]
                },
                options: {
                    responsive: true,
                    plugins: {
                        title: {
                            display: true,
                            text: 'Fuzzy numbers drawing demo'
                        },
                    },
                    scales: {
                        x: {
                            display: true,
                            type: 'linear',
                            title: {
                                display: true
                            },
                            suggestedMin: 0,
                            suggestedMax: 10
                        },
                        y: {
                            display: true,
                            title: {
                                display: true
                            },
                            suggestedMin: 0,
                            suggestedMax: 1
                        }
                    }
                }
            }

            chart = new Chart(ctx, config);
        }
    </script>
</body>
</html>
